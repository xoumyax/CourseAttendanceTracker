<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - {course}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Student Registration</h1>
                <p data-cfg="course_name"></p>
                <p>Create your account with the one-time enrollment code from your instructor</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="studentId">Student ID:</label>
                    <input type="text" id="studentId" name="studentId" required autocomplete="username"
                           placeholder="Enter your student ID">
                </div>
                <div class="form-group">
                    <label for="code">Enrollment code:</label>
                    <input type="text" id="code" name="code" required autocomplete="off"
                           placeholder="e.g. K7Q2-9MXD">
                    <small>Your instructor hands these out. Each code works once.</small>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="72"
                           autocomplete="new-password" placeholder="Choose a password (min 8 characters)">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           autocomplete="new-password" placeholder="Re-enter your password">
                </div>
                <div id="error-message" class="error" style="display: none;"></div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
            <div id="success-message" class="success" style="display: none; text-align: center;"></div>
            <div id="login-link" style="text-align: center; margin-top: 1rem;">
                <a href="/student/login" style="color: var(--primary-color);">Already registered? Login here</a>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/student_register.js"></script>
</body>
</html>
