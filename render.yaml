services:
  - type: web
    name: course-attendance-tracker
    runtime: python
    plan: starter  # a persistent disk needs a paid plan; see DEPLOYMENT_GUIDE.md
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/attendance.db
      - key: COURSE_NAME
        sync: false
      - key: TIMEZONE
        sync: false
      - key: CHECKIN_WINDOWS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
